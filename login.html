<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign In — Voice Studio</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .dash-login-page {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 80px);
            padding: 2rem 1.5rem;
        }
        .dash-login-card {
            max-width: 380px;
            width: 100%;
        }
        .dash-login-card h1 {
            text-align: center;
            font-size: 2.2rem;
            font-weight: 300;
            margin-bottom: 0.3rem;
        }
        .dash-login-tagline {
            text-align: center;
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 2.5rem;
            line-height: 1.6;
        }
        .dash-login-card .form-group {
            margin-bottom: 1.5rem;
        }
        .dash-login-card input[type="text"] {
            padding: 0.75rem 0.85rem;
            font-size: 15px;
            border-radius: 2px;
        }
        .dash-login-card input.code-input {
            padding: 0.75rem 0.85rem;
            font-size: 24px;
            letter-spacing: 0.35em;
            text-align: center;
            border-radius: 2px;
            width: 100%;
        }
        .dash-login-card .btn-primary {
            padding: 0.75rem 1.5rem;
        }
        .dash-login-help {
            text-align: center;
            margin-top: 2rem;
            font-size: 13px;
            color: var(--text-muted);
        }
        .dash-login-card .login-container {
            margin: 0;
            max-width: none;
            padding: 0;
        }
        .code-note {
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 1.5rem;
            line-height: 1.6;
        }
        .resend-row {
            text-align: center;
            margin-top: 1rem;
            font-size: 13px;
        }
        .resend-row a {
            color: var(--text-muted);
            text-decoration: underline;
        }
        .resend-row .cooldown {
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<nav>
    <div class="container">
        <a href="index.html" class="nav-brand">Voice Studio</a>
    </div>
</nav>

<div class="dash-login-page">
    <div class="dash-login-card">
        <div class="login-container">
            <h1>Welcome</h1>
            <p class="dash-login-tagline" id="login-tagline">Enter your email to sign in. No password needed: we will send a code to your inbox.</p>

            <div id="login-error" class="login-error"></div>

            <!-- Step 1: email -->
            <form id="email-form">
                <div class="form-group">
                    <label for="login-email">Email</label>
                    <input type="text" id="login-email" placeholder="you@berklee.edu" required autocapitalize="none" autocorrect="off" autocomplete="email">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">
                    Continue
                </button>
            </form>

            <!-- Step 2: code -->
            <form id="code-form" style="display: none;">
                <p class="code-note" id="code-note">We sent a login code to your email.<br>Enter it below. It may take a minute to arrive.</p>
                <div class="form-group">
                    <label for="login-code">Login code</label>
                    <input type="text" id="login-code" class="code-input" inputmode="numeric" pattern="[0-9]*" maxlength="10" placeholder="Enter code" required autocomplete="one-time-code">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">
                    Sign In
                </button>
                <div class="resend-row">
                    <span id="resend-cooldown" class="cooldown"></span>
                    <a href="#" id="resend-link" style="display: none;">Send a new code</a>
                    <span> &middot; </span>
                    <a href="#" id="change-email-link">Use a different email</a>
                </div>
            </form>

            <p class="dash-login-help">
                Need access? Contact Prof. Gautereaux.
            </p>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', async function() {
        const TEACHER_EMAILS = ['kayla@studio.kaylagautereaux.com'];

        try {
            const { createClient } = window.supabase;
            const sb = createClient(
                'https://ukvkljztinkzmkbtsfuo.supabase.co',
                'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVrdmtsanp0aW5rem1rYnRzZnVvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM3MTAxMTUsImV4cCI6MjA4OTI4NjExNX0.dh0zSDQyTjvBrArPA7szI_NekBF1_V6CU8e7pLdpV1k'
            );

            // Already signed in (including arriving via a legacy emailed link):
            // route to the right home.
            const { data: { session } } = await sb.auth.getSession();
            if (session) {
                const email = (session.user.email || '').toLowerCase();
                window.location.href = TEACHER_EMAILS.includes(email) ? 'teacher.html' : 'dashboard.html';
                return;
            }

            const emailForm = document.getElementById('email-form');
            const codeForm = document.getElementById('code-form');
            const errorEl = document.getElementById('login-error');
            const tagline = document.getElementById('login-tagline');
            const codeNote = document.getElementById('code-note');
            const resendLink = document.getElementById('resend-link');
            const cooldownEl = document.getElementById('resend-cooldown');
            const changeEmailLink = document.getElementById('change-email-link');

            let currentEmail = null;
            let cooldownTimer = null;

            function showError(msg) {
                errorEl.textContent = msg;
                errorEl.style.display = 'block';
            }

            function clearError() {
                errorEl.style.display = 'none';
            }

            function startCooldown(seconds) {
                resendLink.style.display = 'none';
                let remaining = seconds;
                cooldownEl.textContent = 'You can request a new code in ' + remaining + 's';
                clearInterval(cooldownTimer);
                cooldownTimer = setInterval(() => {
                    remaining -= 1;
                    if (remaining <= 0) {
                        clearInterval(cooldownTimer);
                        cooldownEl.textContent = '';
                        resendLink.style.display = 'inline';
                    } else {
                        cooldownEl.textContent = 'You can request a new code in ' + remaining + 's';
                    }
                }, 1000);
            }

            async function sendCode(email) {
                const { error } = await sb.auth.signInWithOtp({
                    email: email,
                    options: { shouldCreateUser: false }
                });
                if (error) {
                    const msg = (error.message || '').toLowerCase();
                    if (msg.includes('signups not allowed') || msg.includes('user not found')) {
                        showError('This email is not registered with the studio. Contact Prof. Gautereaux for access.');
                    } else if (msg.includes('rate limit') || msg.includes('security purposes')) {
                        showError('A code was sent recently. Check your inbox, or wait a minute before requesting another.');
                    } else {
                        showError('Could not send a code: ' + error.message);
                    }
                    return false;
                }
                return true;
            }

            emailForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                clearError();
                const raw = document.getElementById('login-email').value.trim().toLowerCase();
                if (!raw) return;
                // Bare usernames default to berklee.edu
                const email = raw.includes('@') ? raw : raw + '@berklee.edu';

                // Teacher accounts sign in on the Studio page
                if (TEACHER_EMAILS.includes(email)) {
                    window.location.href = 'teacher.html';
                    return;
                }

                const btn = emailForm.querySelector('button[type="submit"]');
                btn.textContent = 'Sending code...';
                btn.disabled = true;

                const ok = await sendCode(email);

                btn.textContent = 'Continue';
                btn.disabled = false;

                if (ok) {
                    currentEmail = email;
                    emailForm.style.display = 'none';
                    codeForm.style.display = 'block';
                    tagline.textContent = 'Check your email.';
                    codeNote.innerHTML = 'We sent a login code to <strong>' + email + '</strong>.<br>Enter it below. It may take a minute to arrive.';
                    document.getElementById('login-code').focus();
                    startCooldown(30);
                }
            });

            codeForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                clearError();
                const code = document.getElementById('login-code').value.trim();
                if (!code || !currentEmail) return;

                const btn = codeForm.querySelector('button[type="submit"]');
                btn.textContent = 'Signing in...';
                btn.disabled = true;

                const { data, error } = await sb.auth.verifyOtp({
                    email: currentEmail,
                    token: code,
                    type: 'email'
                });

                if (error) {
                    const msg = (error.message || '').toLowerCase();
                    if (msg.includes('expired') || msg.includes('invalid')) {
                        showError('That code is incorrect or has expired. Check the newest email, or request a new code.');
                    } else {
                        showError('Could not sign in: ' + error.message);
                    }
                    btn.textContent = 'Sign In';
                    btn.disabled = false;
                    return;
                }

                window.location.href = 'dashboard.html';
            });

            resendLink.addEventListener('click', async function(e) {
                e.preventDefault();
                clearError();
                if (!currentEmail) return;
                const ok = await sendCode(currentEmail);
                if (ok) {
                    codeNote.innerHTML = 'A new code is on its way to <strong>' + currentEmail + '</strong>.<br>Use the newest code in your inbox.';
                    startCooldown(30);
                }
            });

            changeEmailLink.addEventListener('click', function(e) {
                e.preventDefault();
                clearError();
                clearInterval(cooldownTimer);
                currentEmail = null;
                codeForm.style.display = 'none';
                emailForm.style.display = 'block';
                tagline.textContent = 'Enter your email to sign in. No password needed: we will send a code to your inbox.';
                document.getElementById('login-code').value = '';
                document.getElementById('login-email').focus();
            });

        } catch (err) {
            console.error('Login init error:', err);
            document.getElementById('login-error').textContent = 'Something went wrong loading the page. Refresh and try again.';
            document.getElementById('login-error').style.display = 'block';
        }
    });
</script>

<script src="js/feedback-widget.js"></script>
</body>
</html>
